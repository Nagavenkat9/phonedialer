name: Memories Android app

# Builds the installable Memories gallery APK.
# Download it from the run's "Artifacts" section (memories-apk).

on:
  push:
    paths:
      - "memories-app/**"
      - ".github/workflows/memories-android.yml"
  pull_request:
    paths:
      - "memories-app/**"
      - ".github/workflows/memories-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memories-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memories-apk
          path: memories-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
